#:schema https://github.com/jdx/mise/raw/main/schema/mise.json
min_version = "2026.10.0"

[settings]
dotfiles.root = "~/.dotfiles"
python.uv_venv_auto = true
trusted_config_paths = ["~/projects", "~/code"]
env_file = ".env"

# Avoid silently installing heavyweight tools merely because a config is active.
auto_install_disable_tools = ["node", "k9s"]

[bootstrap.packages]
# Base packages only; versioned tools are managed by [tools] and conf.d.
# mise applies entries only when their package manager is available.
"apt:git" = "latest"
"apt:curl" = "latest"
"apt:zsh" = "latest"
"apt:build-essential" = "latest"
"dnf:git" = "latest"
"dnf:curl" = "latest"
"dnf:zsh" = "latest"
"dnf:@development-tools" = "latest"

[bootstrap.repos]
"~/.dotfiles" = { url = "https://github.com/IanCWeston/dotfiles.git" }
"~/.antidote" = { url = "https://github.com/mattmc3/antidote.git" }
"~/.tmux/plugins/tpm" = { url = "https://github.com/tmux-plugins/tpm.git" }

[dotfiles]
"~/.zshenv" = { source = "~/.dotfiles/.zshenv", mode = "symlink" }
"~/.config" = { source = "~/.dotfiles/xdg_config", mode = "symlink-each" }

[bootstrap.hooks.final]
run = '''
# Bootstrap hooks are non-interactive; mise shims are the supported activation
# mechanism for this context and let `mise doctor` verify the installation.
export PATH="$HOME/.local/share/mise/shims:$PATH"
mise doctor
echo "Bootstrap complete."
'''
